[DEFAULT]
# All sections below are required unless otherwise specified.
# See https://github.com/fastai/nbdev/blob/master/settings.ini for examples.

### Python library ###
repo = wavefm
lib_name = %(repo)s
version = 0.0.1
min_python = 3.10
license = apache2
black_formatting = False

### nbdev ###
doc_path = _docs
lib_path = wavefm
nbs_path = nbs
recursive = True
tst_flags = notest
put_version_in_init = True

### Docs ###
branch = main
custom_sidebar = False
doc_host = https://%(user)s.github.io
doc_baseurl = /%(repo)s
git_url = https://github.com/%(user)s/%(repo)s
title = %(lib_name)s

### PyPI ###
audience = Developers
author = benmfox
author_email = benmfox@me.com
copyright = 2023 onwards, %(author)s
description = WaveFM - Physiological Time Series AI
keywords = nbdev jupyter notebook python waveforms AI signals
language = English
status = 3
user = benmfox

### Optional ###
requirements = execnb==0.1.12 fastcore<2 setuptools>=64.0,<75.0 optuna==3.6.1 optuna-integration wandb==0.19.2 scikit-learn ipykernel pyedflib mne edfio lxml nbdev==2.4.14 tqdm scipy zarr dask psycopg torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 torchmetrics==1.6.1 seaborn matplotlib psycopg[binary] pyyaml numpy pandas streamlit plotly==5.15.0 plotly_resampler lightning==2.5.0 pytorch_metric_learning torchsurv==0.1.4 lxt==2.0 rotary-embedding-torch pycox scikit-survival biosppy PeakUtils zclip pytz transformers==4.51.3 sleepecg
